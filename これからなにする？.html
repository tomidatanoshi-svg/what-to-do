    .dice {
      font-size: 70px;

      margin: 10px 0 20px;

      display: inline-block;
    }


    /* =========================
       サイコロ回転
    ========================= */

    .dice.roll {
      animation:
        rollDice
        1s
        ease-in-out;
    }


    @keyframes rollDice {

      0% {
        transform: rotate(0deg);
      }

      25% {
        transform: rotate(180deg);
      }

      50% {
        transform: rotate(360deg);
      }

      75% {
        transform: rotate(540deg);
      }

      100% {
        transform: rotate(720deg);
      }

    }


    /* =========================
       サイコロ停止時
    ========================= */

    .dice.bounce {
      animation:
        bounceDice
        0.3s
        ease-out;
    }


    @keyframes bounceDice {

      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.25);
      }

      100% {
        transform: scale(1);
      }

    }


    /* =========================
       見出し
    ========================= */

    .section-title {

      font-size: 15px;

      font-weight: bold;

      margin:
        15px 0
        8px;

    }


    /* =========================
       カテゴリー
    ========================= */

    .categories {

      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 8px;

      margin-bottom: 15px;

    }


    .category {

      border: none;

      border-radius: 12px;

      padding: 10px 4px;

      background: #f1f1f1;

      font-size: 12px;

      cursor: pointer;

    }


    .category.selected {

      background: #222;

      color: white;

      font-weight: bold;

    }


    /* 完全ランダム */

    .category.random-category {

      grid-column:
        1 / -1;

      font-size: 14px;

      padding: 12px;

      background: #f5f5f5;

    }


    .category.random-category.selected {

      background: #222;

      color: white;

    }


    /* =========================
       人数
    ========================= */

    .people-buttons {

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 8px;

      margin-bottom: 15px;

    }


    .people-button {

      border: none;

      border-radius: 12px;

      padding: 10px 4px;

      background: #f1f1f1;

      font-size: 12px;

      cursor: pointer;

    }


    .people-button.selected {

      background: #222;

      color: white;

      font-weight: bold;

    }


    /* =========================
       ミッション
    ========================= */

    .mission-buttons {

      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 8px;

      margin-bottom: 20px;

    }


    .mission-button {

      border: none;

      border-radius: 12px;

      padding: 10px;

      background: #f1f1f1;

      font-size: 13px;

      cursor: pointer;

    }

      background: #222;

      color: white;

      font-weight: bold;

    }

       メインボタン
    ========================= */

      width: 100%;

      border: none;

      border-radius: 16px;

      background: #111;

      color: white;

      font-size: 18px;

      font-weight: bold;

      padding: 16px;

      cursor: pointer;

      transition:
        transform 0.1s,
        opacity 0.2s;

    }


    #actionButton:active {

      transform: scale(0.97);

    }


    #actionButton:disabled {

      opacity: 0.5;

      cursor: default;

    }


    /* =========================
       結果
    ========================= */

    #result {

/* ==================================================
   カテゴリー選択
================================================== */


function selectCategory(category, element) {

  currentCategory = category;


  /*
    カテゴリーを変えたら
    お題履歴をリセット
  */

  recentActions = [];


  document
    .querySelectorAll(".category")
    .forEach(function(button) {

      button.classList.remove("selected");

    });


  element.classList.add("selected");


  resetResult();

}

  /*
    人数を変えたら
    お題履歴をリセット
  */

  recentActions = [];


  document
    .querySelectorAll(".people-button")
    .forEach(function(button) {

      button.classList.remove("selected");

    });


  element.classList.add("selected");


  resetResult();

}



/* ==================================================
   ミッション選択
================================================== */


function selectMission(enabled, element) {

  missionEnabled = enabled;


  document
    .querySelectorAll(".mission-button")
    .forEach(function(button) {

      button.classList.remove("selected");

    });


  element.classList.add("selected");


  resetResult();

}



/* ==================================================
   結果リセット
================================================== */


function resetResult() {

  document.getElementById("result").innerHTML =
    '<span class="message">ボタンを押してみて</span>';

}



/* ==================================================
   人数による文章調整
================================================== */


function adjustText(text) {

  let result = text;


  if (currentPeople === "two") {

    result = result
      .replaceAll("全員", "2人で")
      .replaceAll("みんな", "2人で");

  }


  else {

    result = result
      .replaceAll("相手", "みんな")
      .replaceAll("お互い", "みんなで")
      .replaceAll("2人", "みんなで")
      .replaceAll("全員", "みんなで");

  }


  return result;

}



/* ==================================================
   完全ランダム用
================================================== */


function getAllActions() {

  let allActions = [];


  /*
    7カテゴリーのお題を
    すべて1つの配列にまとめる
  */

  Object.keys(actions).forEach(function(category) {

    allActions =
      allActions.concat(actions[category]);

  });


  return allActions;

}



/* ==================================================
   完全ランダム用ミッション
================================================== */


function getAllMissions() {

  let allMissions = [];


  /*
    7カテゴリーのミッションを
    すべて1つの配列にまとめる
  */

  Object.keys(missions).forEach(function(category) {

    allMissions =
      allMissions.concat(missions[category]);

  });


  return allMissions;

}



/* ==================================================
   お題抽選
================================================== */


function randomAction() {

  const dice =
    document.getElementById("dice");


  const button =
    document.getElementById("actionButton");


  /*
    抽選中はボタンを押せない
  */

  button.disabled = true;


  /*
    サイコロアニメーション
  */

  dice.classList.remove("roll");

  dice.classList.remove("bounce");


  void dice.offsetWidth;


  dice.classList.add("roll");



  /*
    1秒後に結果表示
  */

  setTimeout(function() {


    /* ==========================================
       お題一覧を決定
    ========================================== */


    let selectedActions;


    if (currentCategory === "random") {

      /*
        完全ランダム

        7カテゴリー全部
      */

      selectedActions =
        getAllActions();

    }


    else {

      /*
        通常カテゴリー

        選択されたカテゴリーだけ
      */

      selectedActions =
        actions[currentCategory];

    }



    /* ==========================================
       過去5回のお題を除外
    ========================================== */


    let availableActions =
      selectedActions.filter(function(action) {

        return !recentActions.includes(action);

      });



    /* ==========================================
       候補がなくなった場合
    ========================================== */


    while (
      availableActions.length === 0 &&
      recentActions.length > 0
    ) {


      /*
        一番古い履歴を削除
      */

      recentActions.shift();


      /*
        もう一度候補を作る
      */

      availableActions =
        selectedActions.filter(function(action) {

          return !recentActions.includes(action);

        });

    }



    /* ==========================================
       ランダム抽選
    ========================================== */


    const actionIndex =
      Math.floor(
        Math.random() *
        availableActions.length
      );


    let selectedAction =
      availableActions[actionIndex];



    /* ==========================================
       履歴に追加
    ========================================== */


    recentActions.push(selectedAction);



    /*
      6個以上になったら
      一番古いものを削除
    */

    if (recentActions.length > 5) {

      recentActions.shift();

    }



    /* ==========================================
       人数に合わせて文章変更
    ========================================== */


    selectedAction =
      adjustText(selectedAction);



    /* ==========================================
       結果表示
    ========================================== */


    let resultHTML = "";



    /*
      完全ランダムなら
      特別な表示
    */

    if (currentCategory === "random") {

      resultHTML += `

        <div class="random-label">
          🎲 7カテゴリーから完全ランダム！
        </div>

      `;

    }


    resultHTML += `

      <div class="result-title">
        🎲 今日のお題
      </div>


      <div class="result-action">
        ${selectedAction}
      </div>

    `;



    /* ==========================================
       追加ミッション
    ========================================== */


    if (missionEnabled) {


      let selectedMissions;


      if (currentCategory === "random") {

        /*
          完全ランダムなら
          ミッションも全カテゴリーから抽選
        */

        selectedMissions =
          getAllMissions();

      }


      else {

        /*
          通常カテゴリーなら
          そのカテゴリーのミッション
        */

        selectedMissions =
          missions[currentCategory];

      }



      const missionIndex =
        Math.floor(
          Math.random() *
          selectedMissions.length
        );


      let selectedMission =
        selectedMissions[missionIndex];


      selectedMission =
        adjustText(selectedMission);



      resultHTML += `

        <div class="mission">

          <div class="mission-title">
            🎯 追加ミッション
          </div>


          <div class="mission-text">
            ${selectedMission}
          </div>

        </div>

      `;

    }



    /* ==========================================
       画面に結果表示
    ========================================== */


    document.getElementById("result").innerHTML =
      resultHTML;



    /* ==========================================
       サイコロをバウンド
    ========================================== */


    dice.classList.remove("roll");

    dice.classList.add("bounce");


    /*
      ボタンを再び押せるようにする
    */

    button.disabled = false;


  }, 1000);

}


</script>
